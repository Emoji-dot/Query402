name: CI / quality
on: [pull_request, push]

# CI never pushes changes back to the repository.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Bound total job runtime so a hung install, lint, or test step fails fast (<= 20 min)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Static asset guard
        run: |
          node --test scripts/check-static-assets.test.mjs
          node scripts/check-static-assets.mjs

      - name: Repository malware guard
        run: |
          node scripts/check-repo-malware.mjs
          node --test scripts/check-repo-malware.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
